<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root { --blue:#1f4fd6; --blue-soft:#eef3fb; --ink:#1b2440; --muted:#5d6a86; --line:#d6deee; --green:#1f8a4c; --red:#d4453b; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1760px; height:760px; background:#fff; font-family:"Noto Sans KR","Malgun Gothic",sans-serif; color:var(--ink); }
  .wrap { width:1760px; height:760px; padding:10px 20px; display:flex; flex-direction:column; gap:26px; }
  .sub { font-size:26px; color:var(--muted); font-weight:500; border-bottom:2px solid var(--line); padding-bottom:16px; }
  .panels { display:flex; gap:40px; }
  .panel { flex:1; border:2px solid var(--line); border-radius:22px; padding:26px 32px 22px; background:#f8fafd; position:relative; }
  .panel.after { background:var(--blue-soft); }
  .tag { font-size:22px; font-weight:800; letter-spacing:.04em; }
  .tag.b { color:var(--red); } .tag.a { color:var(--green); }
  .panel h3 { font-size:30px; font-weight:800; margin:6px 0 10px; }
  svg { width:100%; height:320px; display:block; }
  .pill { display:inline-block; margin-top:8px; padding:10px 28px; border-radius:16px; font-size:24px; font-weight:800; }
  .pill.b { background:#fde8e6; color:var(--red); } .pill.a { background:#e3f5e9; color:var(--green); }
  .strip { border:2px solid var(--line); border-radius:18px; padding:22px 30px; display:flex; justify-content:space-between; font-size:26px; font-weight:700; }
  .strip span::before { content:"✔ "; color:var(--blue); }
</style></head><body><div class="wrap">
  <div class="sub">값 범위 검증을 넘어, 경로·구역·전투 난이도까지 일관되게 보정합니다</div>
  <div class="panels">
    <div class="panel">
      <div class="tag b">BEFORE</div><h3>LLM 원본: 8자 경로, 겹친 구역, spawn-goal 근접</h3>
      <svg viewBox="0 0 800 320">
        <!-- figure-8 crossing path -->
        <polyline points="80,250 700,70 700,250 80,70" fill="none" stroke="#9aa6bd" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="80" y1="250" x2="700" y2="70" stroke="#d4453b" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 22"/>
        <line x1="700" y1="250" x2="80" y2="70" stroke="#d4453b" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 22"/>
        <circle cx="390" cy="160" r="26" fill="none" stroke="#d4453b" stroke-width="8"/>
        <!-- overlapping combat circles -->
        <circle cx="520" cy="150" r="58" fill="#f6b8b3" fill-opacity=".7" stroke="#d4453b" stroke-width="5"/>
        <circle cx="560" cy="170" r="58" fill="#f6b8b3" fill-opacity=".7" stroke="#d4453b" stroke-width="5"/>
        <circle cx="545" cy="135" r="58" fill="#f6b8b3" fill-opacity=".7" stroke="#d4453b" stroke-width="5"/>
        <!-- spawn/goal too close -->
        <circle cx="80" cy="250" r="16" fill="#1f4fd6"/>
        <circle cx="80" cy="70" r="16" fill="#d4453b"/>
        <text x="110" y="258" font-size="22" fill="#1f4fd6" font-weight="700">spawn</text>
        <text x="110" y="78" font-size="22" fill="#d4453b" font-weight="700">goal (거리 0.2)</text>
      </svg>
      <span class="pill b">자기교차 · 겹침 · 근접</span>
    </div>
    <div class="panel after">
      <div class="tag a">AFTER</div><h3>보정 후: 정합성이 보장된 레이아웃</h3>
      <svg viewBox="0 0 800 320">
        <polyline points="70,270 220,230 360,150 520,120 720,60" fill="none" stroke="#1f4fd6" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- evenly spaced combat circles along path, increasing difficulty -->
        <circle cx="220" cy="230" r="34" fill="#dbe6fb" stroke="#1f4fd6" stroke-width="5"/>
        <circle cx="360" cy="150" r="40" fill="#b9ccf5" stroke="#1f4fd6" stroke-width="5"/>
        <circle cx="520" cy="120" r="46" fill="#8fb0f0" stroke="#1f4fd6" stroke-width="5"/>
        <text x="220" y="238" font-size="20" fill="#1f4fd6" font-weight="800" text-anchor="middle">0.3</text>
        <text x="360" y="158" font-size="20" fill="#1f4fd6" font-weight="800" text-anchor="middle">0.6</text>
        <text x="520" y="128" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">0.9</text>
        <circle cx="70" cy="270" r="18" fill="#1f8a4c"/>
        <circle cx="720" cy="60" r="18" fill="#1f4fd6"/>
        <text x="40" y="306" font-size="22" fill="#1f8a4c" font-weight="700">spawn</text>
        <text x="690" y="40" font-size="22" fill="#1f4fd6" font-weight="700">goal</text>
        <text x="380" y="300" font-size="20" fill="#5d6a86" text-anchor="middle">진행도 순 정렬 · 간격 ≥ 0.06 · 난이도 ↑</text>
      </svg>
      <span class="pill a">경로 순서 · 간격 · 난이도 보장</span>
    </div>
  </div>
  <div class="strip">
    <span>2-opt 교차 제거</span><span>시작–끝 거리 ≥ 0.45</span><span>구역 간격 ≥ 0.06</span><span>2D 겹침 0</span><span>난이도 단조 증가</span><span>멱등 · 난수 0</span>
  </div>
</div></body></html>
