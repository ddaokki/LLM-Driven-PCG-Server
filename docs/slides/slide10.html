<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root { --blue:#1f4fd6; --blue-soft:#eef3fb; --ink:#1b2440; --muted:#5d6a86; --line:#d6deee; --green:#1f8a4c; --red:#d4453b; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1760px; height:760px; background:#fff; font-family:"Noto Sans KR","Malgun Gothic",sans-serif; color:var(--ink); }
  .wrap { width:1760px; height:760px; padding:10px 20px; display:flex; flex-direction:column; gap:26px; }
  .sub { font-size:26px; color:var(--muted); font-weight:500; border-bottom:2px solid var(--line); padding-bottom:16px; }
  .panels { display:flex; gap:40px; }
  .panel { flex:1; border:2px solid var(--line); border-radius:22px; padding:26px 32px 22px; background:#f8fafd; position:relative; }
  .panel.after { background:var(--blue-soft); }
  .tag { font-size:22px; font-weight:800; letter-spacing:.04em; }
  .tag.b { color:var(--red); } .tag.a { color:var(--green); }
  .panel h3 { font-size:30px; font-weight:800; margin:6px 0 10px; }
  svg { width:100%; height:320px; display:block; }
  .pill { display:inline-block; margin-top:8px; padding:10px 28px; border-radius:16px; font-size:24px; font-weight:800; }
  .pill.b { background:#fde8e6; color:var(--red); } .pill.a { background:#e3f5e9; color:var(--green); }
  .strip { border:2px solid var(--line); border-radius:18px; padding:22px 30px; display:flex; justify-content:space-between; font-size:26px; font-weight:700; }
  .strip span::before { content:"✔ "; color:var(--blue); }
</style></head><body><div class="wrap">
  <div class="sub">LLM단 1차 보정 뒤에도 남는 구역 간격·순서·난이도까지 보정하고, 어떤 입력 경로든 같은 결과를 보장합니다</div>
  <div class="panels">
    <div class="panel">
      <div class="tag b">BEFORE</div><h3>LLM 출력: 길 규칙은 통과, 구역 배치는 미보장</h3>
      <svg viewBox="0 0 800 320">
        <!-- same zig-zag path in both panels: shape is kept, not straightened -->
        <polyline points="70,190 260,70 420,250 640,110 740,240" fill="none" stroke="#9aa6bd" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- touching combat circles (gap 0) -->
        <circle cx="318" cy="135" r="36" fill="#f6b8b3" fill-opacity=".75" stroke="#d4453b" stroke-width="5"/>
        <circle cx="372" cy="196" r="44" fill="#f6b8b3" fill-opacity=".75" stroke="#d4453b" stroke-width="5"/>
        <!-- third combat, later on path -->
        <circle cx="560" cy="160" r="30" fill="#f6b8b3" fill-opacity=".75" stroke="#d4453b" stroke-width="5"/>
        <!-- array index labels out of path order + difficulty -->
        <text x="318" y="143" font-size="20" fill="#d4453b" font-weight="800" text-anchor="middle">0.9</text>
        <text x="372" y="204" font-size="20" fill="#d4453b" font-weight="800" text-anchor="middle">0.3</text>
        <text x="560" y="168" font-size="20" fill="#d4453b" font-weight="800" text-anchor="middle">0.6</text>
        <text x="318" y="86" font-size="19" fill="#5d6a86" font-weight="700" text-anchor="middle">areas[2]</text>
        <text x="372" y="262" font-size="19" fill="#5d6a86" font-weight="700" text-anchor="middle">areas[0]</text>
        <text x="560" y="118" font-size="19" fill="#5d6a86" font-weight="700" text-anchor="middle">areas[1]</text>
        <!-- gap 0 marker -->
        <line x1="345" y1="166" x2="300" y2="236" stroke="#d4453b" stroke-width="3"/>
        <text x="296" y="258" font-size="20" fill="#d4453b" font-weight="800" text-anchor="middle">간격 0</text>
        <circle cx="70" cy="190" r="18" fill="#1f8a4c"/>
        <circle cx="740" cy="240" r="18" fill="#1f4fd6"/>
        <text x="40" y="228" font-size="22" fill="#1f8a4c" font-weight="700">spawn</text>
        <text x="716" y="282" font-size="22" fill="#1f4fd6" font-weight="700">goal</text>
        <text x="400" y="306" font-size="20" fill="#5d6a86" text-anchor="middle">맞닿은 구역 · 배열 순서 ≠ 경로 순서 · 난이도 0.9→0.3→0.6</text>
      </svg>
      <span class="pill b">간격 0 · 순서 뒤섞임 · 난이도 비단조</span>
    </div>
    <div class="panel after">
      <div class="tag a">AFTER</div><h3>백엔드 보정 후: 경로는 그대로, 구역은 규칙대로</h3>
      <svg viewBox="0 0 800 320">
        <polyline points="70,190 260,70 420,250 640,110 740,240" fill="none" stroke="#1f4fd6" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- spaced along path, ordered, difficulty increasing -->
        <circle cx="175" cy="124" r="30" fill="#dbe6fb" stroke="#1f4fd6" stroke-width="5"/>
        <circle cx="372" cy="196" r="36" fill="#b9ccf5" stroke="#1f4fd6" stroke-width="5"/>
        <circle cx="560" cy="160" r="42" fill="#8fb0f0" stroke="#1f4fd6" stroke-width="5"/>
        <text x="175" y="132" font-size="20" fill="#1f4fd6" font-weight="800" text-anchor="middle">0.3</text>
        <text x="372" y="204" font-size="20" fill="#1f4fd6" font-weight="800" text-anchor="middle">0.6</text>
        <text x="560" y="168" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">0.9</text>
        <text x="175" y="80" font-size="19" fill="#5d6a86" font-weight="700" text-anchor="middle">areas[0]</text>
        <text x="372" y="262" font-size="19" fill="#5d6a86" font-weight="700" text-anchor="middle">areas[1]</text>
        <text x="560" y="104" font-size="19" fill="#5d6a86" font-weight="700" text-anchor="middle">areas[2]</text>
        <!-- gap marker -->
        <line x1="408" y1="212" x2="518" y2="172" stroke="#1f8a4c" stroke-width="3" stroke-dasharray="8 6"/>
        <text x="470" y="250" font-size="20" fill="#1f8a4c" font-weight="800" text-anchor="middle">≥ 0.06</text>
        <circle cx="70" cy="190" r="18" fill="#1f8a4c"/>
        <circle cx="740" cy="240" r="18" fill="#1f4fd6"/>
        <text x="40" y="228" font-size="22" fill="#1f8a4c" font-weight="700">spawn</text>
        <text x="716" y="282" font-size="22" fill="#1f4fd6" font-weight="700">goal</text>
        <text x="400" y="306" font-size="20" fill="#5d6a86" text-anchor="middle">배열 순서 = 경로 진행 순서 · 인접 간격 ≥ 0.06 · 난이도 ↑</text>
      </svg>
      <span class="pill a">순서 · 간격 · 난이도 보장, 결과는 항상 동일</span>
    </div>
  </div>
  <div class="strip">
    <span>경로 교차·이탈 안전망</span><span>구역 간격 ≥ 0.06</span><span>배열 순서 = 경로 순서</span><span>난이도 단조 증가</span><span>결정적 · 멱등</span><span>LLM·폴백·수동 입력 공통</span>
  </div>
</div></body></html>
