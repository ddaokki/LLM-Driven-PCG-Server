<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root { --blue:#1f4fd6; --blue-soft:#eef3fb; --ink:#1b2440; --muted:#5d6a86; --line:#d6deee; --green:#1f8a4c; --red:#d4453b; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1760px; height:420px; background:#fff; font-family:"Noto Sans KR","Malgun Gothic",sans-serif; color:var(--ink); }
  .wrap { width:1760px; height:420px; padding:10px 20px; display:flex; flex-direction:column; gap:30px; }
  .sub { font-size:26px; color:var(--muted); font-weight:500; border-bottom:2px solid var(--line); padding-bottom:16px; }
  .steps { display:flex; align-items:stretch; gap:0; }
  .card { flex:1; border:2px solid var(--line); background:#f8fafd; border-radius:22px; padding:30px 34px; display:flex; flex-direction:column; gap:12px; min-height:300px; }
  .num { width:60px; height:60px; border-radius:50%; background:#dde7fb; color:var(--blue); font-weight:800; font-size:24px; display:flex; align-items:center; justify-content:center; }
  .card h3 { font-size:36px; font-weight:800; margin-top:6px; }
  .card .d { font-size:26px; color:var(--ink); }
  .card .t { font-size:22px; color:var(--blue); font-weight:700; margin-top:auto; }
  .arrow { width:70px; display:flex; align-items:center; justify-content:center; color:var(--blue); font-size:46px; font-weight:800; }
  .stats { background:var(--blue-soft); border-radius:22px; padding:26px 40px 30px; }
  .stats h4 { font-size:28px; font-weight:800; margin-bottom:18px; }
  .row { display:flex; }
  .stat { flex:1; border-left:3px solid #c9d6f0; padding:0 30px; }
  .stat:first-child { border-left:0; padding-left:0; }
  .stat b { display:block; font-size:50px; font-weight:800; color:var(--blue); line-height:1.1; }
  .stat b.g { color:var(--green); }
  .stat span { font-size:22px; color:var(--muted); }
  .foot { font-size:22px; color:var(--muted); }
</style></head><body><div class="wrap">
  <div class="sub">LLM 경로와 규칙 기반 폴백을 함께 운영하는 장애 허용형 파이프라인</div>
  <div class="steps">
    <div class="card"><div class="num">01</div><h3>Dialogue 입력</h3><div class="d">“숲에 전투 세 번”</div><div class="t">Unreal → Backend</div></div>
    <div class="arrow">➜</div>
    <div class="card"><div class="num">02</div><h3>Zone 해석</h3><div class="d">vLLM + JSON Schema</div><div class="t">실패 시 Rule Fallback</div></div>
    <div class="arrow">➜</div>
    <div class="card"><div class="num">03</div><h3>Zone 보정</h3><div class="d">validator v3 · 테마 · combat 개수</div><div class="t">배열 순서 = 경로 순서</div></div>
    <div class="arrow">➜</div>
    <div class="card"><div class="num">04</div><h3>Unreal 실행</h3><div class="d">전투 전부 클리어 후 Goal 개방</div><div class="t">10/27 계약 반영</div></div>
  </div>
</div></body></html>
